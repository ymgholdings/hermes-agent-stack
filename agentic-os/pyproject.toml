[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-os"
version = "0.1.0"
description = "Multi-agent coding orchestration system with Karpathy validation loop"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "openai>=1.12.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
agentic-os = "agentic_os.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_os*"]
